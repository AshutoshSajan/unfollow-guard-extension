<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Unfollow Guard</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; }
  #app { width: 400px; padding: 14px; background: var(--bg2); color: var(--fg); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top img { width: 36px; height: 36px; }
  .top b { font-size: 16px; color: var(--fg); }
  .tip { font-size: 12px; color: var(--fg2); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.45; }
</style>
</head>
<body>
  <div class="app" id="app" data-theme="system">
    <div class="top"><img src="icons/icon48.png" alt=""><b>Unfollow Guard settings</b></div>
    <div class="tip">Open instagram.com or facebook.com and click the blue <b>Unfollow Guard</b> button in the bottom-right corner. The same settings are available there under ⚙ Settings.</div>
    <div id="settings"></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
